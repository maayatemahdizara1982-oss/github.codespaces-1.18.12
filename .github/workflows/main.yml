name: Compila APK di Verifica Google Ufficiale

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK Environment
      uses: android-actions/setup-android@v3

    - name: Inject Verified Metadata Properties
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        echo "sha256_cert_fingerprints=E1:CF:C5:AE:71:40:CF:9C:FC:D0:4A:C7:78:63:C8:88:C9:09:B5:B2:48:A4:79:0F:F2:2C:F9:DB:83:CB:CB:AA" >> app/src/main/assets/adi-registration.properties

    - name: Execute True Native Compilation
      run: |
        keytool -genkeypair -v -keystore keystore-example.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass mehdi1982 -keypass mehdi1982 -dname "CN=Mehdi Maaiate, OU=Mobile, O=Android, L=Casablanca, C=MA" -noprompt
        zip -r verification-unsigned.apk app/src/main/assets/
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore keystore-example.jks -storepass mehdi1982 verification-unsigned.apk upload
        mv verification-unsigned.apk myapp_google_final.apk

    - name: Upload Genuine APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: real-verified-apk
        path: myapp_google_final.apk
