name: Compila e Firma APK Android Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Native Keystore File
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        keytool -genkeypair -v -keystore keystore-example.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass mehdi1982 -keypass mehdi1982 -dname "CN=lukejefferson, OU=Development, O=Android, L=Casablanca, C=MA"
        zip -r myapp_allineato.apk app/src/main/assets/
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore keystore-example.jks -storepass mehdi1982 myapp_allineato.apk key0

    - name: Upload Verified APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: real-verified-apk
        path: myapp_allineato.apk
