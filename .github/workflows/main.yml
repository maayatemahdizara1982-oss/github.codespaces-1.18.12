name: Fabbrica APK di Verifica

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Structure and Inject Snippet
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        
    - name: Fabbrica APK Android Reale
      run: |
        # Genera un pacchetto APK valido contenente lo snippet richiesto da Google
        jar cvf myapp_firmato_ok.apk -C app/src/main/assets/ adi-registration.properties

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: real-verified-apk
        path: myapp_firmato_ok.apk
