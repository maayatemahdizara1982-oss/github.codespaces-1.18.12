name: Build and Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare Verification Package
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        echo "sha256_cert_fingerprints=A5:A9:23:E5:72:C3:F7:21:67:E0:B2:FD:1B:00:73:AE:B0:0B:57:D3:75:FD:1A:4D:E3:9E:B3:B4:53:A6:54:49" >> app/src/main/assets/adi-registration.properties
        zip -r verified-app-bundle.zip app/src/main/assets/adi-registration.properties

    - name: Upload Verification File to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: real-verified-package
        path: verified-app-bundle.zip
