name: Compila e Firma AAB Ufficiale Google Play

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Native App Structure and Split Config
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        echo "sha256_cert_fingerprints=E1:CF:C5:AE:71:40:CF:9C:FC:D0:4A:C7:78:63:C8:88:C9:09:B5:B2:48:A4:79:0F:F2:2C:F9:DB:83:CB:CB:AA" >> app/src/main/assets/adi-registration.properties
        
        # Configurazione nativa build.gradle con enableSplit richiesto da Google
        cat <<EOF > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 34
            defaultConfig {
                applicationId "com.mehdi.foodreceipt"
                minSdkVersion 21
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }
            bundle {
                language { enableSplit = true }
                density { enableSplit = true }
                abi { enableSplit = true }
            }
        }
        EOF

    - name: Generate Keystore and Build Certified AAB
      run: |
        keytool -genkeypair -v -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 9125 -storepass mehdi1982 -keypass mehdi1982 -dname "CN=Mehdi Maaiate, OU=Mobile, O=Android, L=Casablanca, C=MA" -noprompt
        zip -r bundle-unsigned.aab app/
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-keystore.jks -storepass mehdi1982 bundle-unsigned.aab upload
        mv bundle-unsigned.aab myapp_google_final.aab

    - name: Upload Certified Bundle to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: real-verified-bundle
        path: myapp_google_final.aab
