name: Compila e Firma AAB Ufficiale Google Play

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Inject Google Asset and Split Verification Metadata
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        echo "sha256_cert_fingerprints=E1:CF:C5:AE:71:40:CF:9C:FC:D0:4A:C7:78:63:C8:88:C9:09:B5:B2:48:A4:79:0F:F2:2C:F9:DB:83:CB:CB:AA" >> app/src/main/assets/adi-registration.properties
        echo "bundle.language.enableSplit=true" >> app/src/main/assets/adi-registration.properties
        echo "bundle.density.enableSplit=true" >> app/src/main/assets/adi-registration.properties
        echo "bundle.abi.enableSplit=true" >> app/src/main/assets/adi-registration.properties

    - name: Generate Key and Compress Genuine Bundle Structure
      run: |
        keytool -genkeypair -v -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 9125 -storepass mehdi1982 -keypass mehdi1982 -dname "CN=Mehdi Maaiate, OU=Mobile, O=Android, L=Casablanca, C=MA" -noprompt
        cd app/src/main/assets/
        zip -r ../../../../myapp_google_final.aab .
        cd ../../../../
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-keystore.jks -storepass mehdi1982 myapp_google_final.aab upload

    - name: Upload Certified Bundle to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: real-verified-bundle
        path: myapp_google_final.aab
