name: Build and Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare Verification Zip Artifact
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        zip -r verified-app-bundle.zip app/src/main/assets/adi-registration.properties

    - name: Upload Verification File to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: verified-verification-package
        path: verified-app-bundle.zip
