name: Genera App Bundle Verificato

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject Google Token Snippet
      run: |
        mkdir -p app/src/main/assets
        echo "registration.token=CEDDQ5GFPSFECAAAAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties
        echo "sha256_cert_fingerprints=E1:CF:C5:AE:71:40:CF:9C:FC:D0:4A:C7:78:63:C8:88:C9:09:B5:B2:48:A4:79:0F:F2:2C:F9:DB:83:CB:CB:AA" >> app/src/main/assets/adi-registration.properties

    - name: Build Genuine Android App Bundle
      run: |
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Upload Valid AAB to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: real-google-bundle
        path: app/build/outputs/bundle/release/*.aab
